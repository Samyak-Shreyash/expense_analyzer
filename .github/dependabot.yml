version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      # eslint-config-expo's bundled eslint-plugin-react crashes on ESLint 10.
      - dependency-name: eslint
        versions: [">=10"]
      # typescript-eslint (via ts-api-utils) doesn't support the TypeScript 7 API yet.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /infrastructure/compose
    schedule:
      interval: weekly
