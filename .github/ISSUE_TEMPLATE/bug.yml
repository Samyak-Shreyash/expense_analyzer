name: Bug
description: Report a reproducible defect
title: "[BUG] "
labels:
  - security

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Do not include credentials, tokens, PII or financial data.
      render: text

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who/what is affected?

  - type: checkboxes
    id: regression
    attributes:
      label: Regression
      options:
        - label: This worked previously