name: Security

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # deepmerge: no patched release exists; test-only, via jest-config. Remove once one does.
          allow-ghsas: GHSA-gcqx-w48m-w2h4

  codeql:
    name: CodeQL (${{ matrix.language }})

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Force a full compilation that CodeQL can trace.
      # --no-build-cache: Forces Gradle to recompile so CodeQL sees the code.
      # --no-daemon: Keeps the build in a process CodeQL can monitor.
      - name: Build project for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          cd backend
          ./gradlew build -x test --no-build-cache --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"