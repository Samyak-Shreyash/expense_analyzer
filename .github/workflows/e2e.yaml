name: E2E

# Full stack in docker compose + Playwright journeys and axe checks.
# Needs the repository secret E2E_DOTENV: a complete .env for a throwaway CI stack
# (same variable names as the local .env, with test-only values).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write .env
        env:
          DOTENV: ${{ secrets.E2E_DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Start stack
        run: >
          docker compose --env-file .env -f infrastructure/compose/compose.yaml
          up -d --build --wait postgres redis kafka rustfs backend frontend

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: mkdir -p .auth && npx playwright test

      - name: Backend logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/compose/compose.yaml logs backend --tail 300

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
