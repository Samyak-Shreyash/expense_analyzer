// Root build.gradle for CodeQL integration

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    plugins {
        id 'java'
        id 'org.springframework.boot'
        id 'io.spring.dependency-management'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // CodeQL support - no extra plugins needed, just ensure build works
    }
}

tasks.register('codeqlBuild', JavaExec) {
    group = 'verification'
    description = 'Build the project for CodeQL analysis'

    dependsOn clean, bootJar

    classpath = files(configurations.bootClasspath)
    mainClass = 'com.expenseanalyzer.ExpenseanalyzerApplication'
}
