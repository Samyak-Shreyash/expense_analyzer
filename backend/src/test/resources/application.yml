spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    enable:
      hikari: true
    tags:
      application: expenseanalyzer-test
      environment: test
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  structured:
    format:
      console: logstash
    json:
      customizer: com.expenseanalyzer.observability.SensitiveLogRedactor

app:
  storage:
    type: memory
  oauth:
    jwt:
      secret: test-jwt-secret-key-for-testing-only-1234567890abcdef

server:
  # Prevent Spring from resolving the production-only SERVER_PORT placeholder.
  port: 0
