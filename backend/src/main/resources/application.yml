server:
    port: ${SERVER_PORT:8080}
spring:
  application:
    name: expenseanalyzer

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:expense_analyzer}
    username: ${DB_USER:app_user}
    password: ${DB_USER_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_schema: public
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true
    clean-on-validation-error: false
    encoding: UTF-8
    out-of-order: false
    ignore-missing-migrations: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    enable:
      hikari: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
# OAuth2 Authorization Server Configuration
app:
  oauth:
    # Client Registration (for external clients to register)
    client:
      id: expense-analyzer-client
      secret: ${OAUTH_SECRET}

    # OAuth2 Server endpoints
    server:
      url: http://localhost:${SERVER_PORT:8080}/oauth2/registration
      token: http://localhost:${SERVER_PORT:8080}/oauth2/token
      revoke: http://localhost:${SERVER_PORT:8080}/oauth2/revoke

    # JWT Configuration
    jwt:
      secret: ${JWT_SECRET}
      issuer: http://localhost:${SERVER_PORT:8080}/oauth2/token
      audience: expense-analyzer-api
      tokenExpirationSeconds: ${JWT_REFRESH_SECONDS}
      refreshTokenExpirationSeconds: ${JWT_EXPIRATION_SECONDS}

    # JWT Encoder Configuration for Spring Security 7
    jwt-encoder:
      algorithm: RS256
      key:
        secret: ${JWT_SECRET}
