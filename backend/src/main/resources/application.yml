server:
    address: 0.0.0.0    
    port: ${SERVER_PORT:8080}
spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
    consumer:
      auto-offset-reset: earliest
  servlet:
    multipart:
      # Slightly above app.statement.upload.max-size-bytes so the validator reports the size error.
      max-file-size: 21MB
      max-request-size: 22MB
  config:
    import: optional:file:../.env[.properties]
  application:
    name: expenseanalyzer

  servlet:
    multipart:
      # Matches app.statement.upload.max-size-bytes (20 MB); the request limit allows multipart overhead.
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    url: 
    username: ${DB_USER:app_user}
    password: ${DB_USER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_schema: public
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; fail fast if an entity drifts from it

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true
    clean-on-validation-error: false
    encoding: UTF-8
    out-of-order: false
    ignore-missing-migrations: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,actuator
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    enable:
      hikari: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
    json:
      customizer: com.expenseanalyzer.observability.SensitiveLogRedactor
# OAuth2 Authorization Server Configuration
app:
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    endpoint: ${APP_STORAGE_ENDPOINT:}
    bucket: ${APP_STORAGE_BUCKET}
    region: ${APP_STORAGE_REGION:us-east-1}
    access-key: ${APP_STORAGE_ACCESS_KEY}
    secret-key: ${APP_STORAGE_SECRET_KEY}
    server-side-encryption: ${APP_STORAGE_SSE:true}
  statement:
    upload:
      max-size-bytes: ${STATEMENT_UPLOAD_MAX_BYTES:20971520}
  parser:
    max-rows: ${PARSER_MAX_ROWS:50000}
    max-columns: ${PARSER_MAX_COLUMNS:50}
    timeout: ${PARSER_TIMEOUT:30s}
  worker:
    concurrency: ${WORKER_CONCURRENCY:2}
  # S3-compatible statement storage (RustFS locally). Credentials have no defaults.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:${RUSTFS_API_PORT:9000}}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:statements}
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
  oauth:
    client:
      id: expense-analyzer-client
      secret: ${JWT_SECRET}

    # OAuth2 Server endpoints
    server:
      secret: ${OAUTH_SECRET}
      url: http://localhost:${SERVER_PORT:8080}/oauth2/registration
      token: http://localhost:${SERVER_PORT:8080}/oauth2/token
      revoke: http://localhost:${SERVER_PORT:8080}/oauth2/revoke

    # JWT Configuration
    jwt:
      secret: ${JWT_SECRET}
      issuer: http://localhost:${SERVER_PORT:8080}/oauth2/token
      audience: expense-analyzer-api
      tokenExpirationSeconds: ${JWT_EXPIRATION_SECONDS}
      refreshTokenExpirationSeconds: ${JWT_REFRESH_SECONDS}

    # JWT Encoder Configuration for Spring Security 7
    jwt-encoder:
      algorithm: RS256
      key:
        secret: ${JWT_SECRET}
