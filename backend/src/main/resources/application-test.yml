server:
  port: 0

spring:
  application:
    name: expenseanalyzer

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

app:
  oauth:
    client:
      id: expense-analyzer-client
      secret: test-secret-for-testing-only

    server:
      url: http://localhost:0/oauth2/registration
      token: http://localhost:0/oauth2/token
      revoke: http://localhost:0/oauth2/revoke

    jwt:
      secret: test-jwt-secret-for-testing-only-32-chars
      issuer: http://localhost:0/oauth2/token
      audience: expense-analyzer-api
      tokenExpirationSeconds: 3600
      refreshTokenExpirationSeconds: 86400

    jwt-encoder:
      algorithm: RS256
      key:
        secret: test-jwt-secret-for-testing-only-32-chars
