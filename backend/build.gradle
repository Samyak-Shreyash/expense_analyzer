plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

ext {
	// Centralized version management
	awsSdkVersion = '2.57.6'
	set('opentelemetry.version', '1.67.0') // above Boot's version for GHSA-ccrj-gw8r-854m
}

group = 'com.expenseanalyzer'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Transitive via kafka-clients; versions with the published advisories fixed
	constraints {
		implementation 'at.yawk.lz4:lz4-java:1.11.4'
		implementation 'org.xerial.snappy:snappy-java:1.1.10.9'
	}

	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Security (version managed by Spring Boot) - Core, OAuth2 JWT, Resource Server, Web, Config
	implementation 'org.springframework.security:spring-security-core'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.security:spring-security-oauth2-resource-server'
	implementation 'org.springframework.security:spring-security-web'
	implementation 'org.springframework.security:spring-security-config'

	implementation 'io.micrometer:micrometer-registry-prometheus'

	// OpenTelemetry (Micrometer tracing bridge + OTLP exporter)
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway
	// Boot 4 moved Flyway auto-configuration into its own module; flyway-core alone never runs migrations
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Redis for rate limiting
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'org.apache.commons:commons-csv:1.12.0'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	implementation 'org.apache.pdfbox:pdfbox:3.0.5'

	// Object storage (S3 API; RustFS locally)
	implementation 'software.amazon.awssdk:s3'

	// Statement processing events (outbox -> Kafka)
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-autoconfigure-processor'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testRuntimeOnly 'com.h2database:h2'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Test observability
	testImplementation 'io.micrometer:micrometer-observation-test'

}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Postgres 18 rejects legacy zone ids some hosts report (e.g. Asia/Calcutta on Windows)
	systemProperty 'user.timezone', 'UTC'
}
