plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

ext {
	// Centralized version management
	logstashEncoderVersion = '7.4'
	openTelemetryVersion = '1.33.0'
	springModulithVersion = "2.1.1"
	springSecurityVersion = '7.2.0-M2' // Spring Security 7.x
}

group = 'com.expenseanalyzer'
version = '0.0.1-SNAPSHOT'

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java']
		}
		test {
			java {
				srcDirs = ['src/test/java']
			}
		}
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Security 7.x (7.2.0-M2) - Core, OAuth2 JWT, Authorization Server
	implementation "org.springframework.security:spring-security-core:${springSecurityVersion}"
	implementation "org.springframework.security:spring-security-oauth2-jose:${springSecurityVersion}"
	implementation "org.springframework.security:spring-security-oauth2-authorization-server:${springSecurityVersion}"

	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Structured JSON Logging
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"

	// Micrometer Tracing Bridge for OpenTelemetry
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'

	// OpenTelemetry OTLP Exporter
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-autoconfigure-processor'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testRuntimeOnly 'com.h2database:h2'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Test observability
	testImplementation 'io.micrometer:micrometer-observation-test'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Optional local runner for a separately downloaded OpenTelemetry Java agent.
tasks.register('bootRunWithOtel', JavaExec) {
	group = 'application'
	description = 'Run the app with the OpenTelemetry Java agent attached.'
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.expenseanalyzer.ExpenseanalyzerApplication'

	def agentJar = layout.projectDirectory.file('agents/opentelemetry-javaagent.jar').asFile
	doFirst {
		if (!agentJar.isFile()) {
			throw new GradleException("OpenTelemetry agent not found at ${agentJar}. Download it before running bootRunWithOtel.")
		}
	}

	jvmArgs = [
		"-javaagent:${agentJar}",
		'-Dotel.service.name=expense-analyzer',
		'-Dotel.exporter.otlp.endpoint=http://localhost:4317',
		'-Dotel.traces.exporter=otlp',
		'-Dotel.metrics.exporter=otlp',
		'-Dotel.logs.exporter=otlp'
	]
}
