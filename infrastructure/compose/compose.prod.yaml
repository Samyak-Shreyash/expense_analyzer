# ============================================================
# Production override for a single VPS.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#   (or just run infrastructure/scripts/deploy.sh)
#
# - The frontend is hosted on Vercel, which proxies /api/* to the backend
#   (frontend/vercel.json), so the browser still sees one origin.
# - The backend is reachable from the internet only through the cloudflared
#   tunnel (HTTPS at Cloudflare's edge); no host ports are published.
# - Postgres, Redis, Kafka, RustFS and the backend are reachable only on
#   the internal Docker network.
# - Observability services (profile "observability") stay off.
# Requires Docker Compose >= 2.24 for !reset / !override.
# ============================================================

services:

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  kafka:
    ports: !reset []
    environment:
      # Keep the broker small on a 4 GB box.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  rustfs:
    # RustFS is pre-1.0; "latest" can change under you on restart.
    image: rustfs/rustfs:${RUSTFS_TAG:?set RUSTFS_TAG in .env to a specific RustFS version}
    ports: !reset []
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"

  backend:
    ports: !reset []
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env to the public https origin}
      # No collector running in prod yet: don't sample or export telemetry.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

  # Served by Vercel in production; only starts if its profile is enabled.
  frontend:
    profiles: ["local-frontend"]

  # Public hostname -> http://backend:${SERVER_PORT} is configured on the
  # tunnel in the Cloudflare dashboard.
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - backend
    networks:
      - expense-analyzer
