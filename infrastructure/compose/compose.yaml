name: expense-analyzer
services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}

    ports:
      - "${DB_BIND_ADDRESS:-0.0.0.0}:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense-analyzer


  # ============================================================
  # Redis (auth rate limiting)
  # ============================================================
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    # No password: set REDIS_BIND_ADDRESS=127.0.0.1 to keep it off the network.
    ports:
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense-analyzer


  # ============================================================
  # Kafka (single-node KRaft; statement processing events)
  # ============================================================
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    # No auth: set KAFKA_BIND_ADDRESS=127.0.0.1 to keep it off the network.
    ports:
      - "${KAFKA_BIND_ADDRESS:-0.0.0.0}:${KAFKA_PORT:-9092}:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - expense-analyzer


  # ============================================================
  # RustFS (S3-compatible object storage for uploaded statements)
  # ============================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"

    ports:
      - "${RUSTFS_BIND_ADDRESS:-0.0.0.0}:${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_BIND_ADDRESS:-0.0.0.0}:${RUSTFS_CONSOLE_PORT:-9001}:9001"

    volumes:
      - rustfs_data:/data

    networks:
      - expense-analyzer


  # ============================================================
  # Expense Analyzer Backend
  # ============================================================
  backend:
    env_file:
      - ../../.env

    build:
      context: ../../backend
      dockerfile: Dockerfile

    container_name: backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rustfs:
        condition: service_started

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STORAGE_ENDPOINT: http://rustfs:9000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

    networks:
      - expense-analyzer


  # ============================================================
  # Expense Analyzer Frontend (static SPA + /api proxy)
  # ============================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      BACKEND_URL: http://backend:${SERVER_PORT}

    ports:
      - "${FRONTEND_PORT:-3001}:80"

    networks:
      - expense-analyzer


  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:main
    container_name: prometheus
    restart: unless-stopped
    profiles:
      - observability

    environment:
      BACKEND_PORT: ${SERVER_PORT}
      OTEL_METRICS_PORT: ${OTEL_METRICS_PORT}

    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        sed -e "s/__BACKEND_PORT__/$${BACKEND_PORT}/g"
        -e "s/__OTEL_METRICS_PORT__/$${OTEL_METRICS_PORT}/g"
        /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml

    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus

    ports:
      - "${PROMETHEUS_PORT}:9090"

    depends_on:
      - backend
      - otel-collector

    networks:
      - expense-analyzer


  # ============================================================
  # OpenTelemetry Collector
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:nightly
    container_name: otel-collector
    restart: unless-stopped
    profiles:
      - observability

    command:
      - --config=/etc/otelcol-contrib/config.yml

    volumes:
      - ../observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro

    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
      - "${OTEL_METRICS_PORT}:9464"

    depends_on:
      tempo:
        condition: service_started

    networks:
      - expense-analyzer


  # ============================================================
  # Grafana Tempo
  # ============================================================
  tempo:
    image: grafana/tempo:main-c6d51cb-2196-1
    container_name: tempo
    restart: unless-stopped
    profiles:
      - observability

    command:
      - -config.file=/etc/tempo/tempo.yml

    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

    ports:
      - "${TEMPO_PORT:-3200}:3200"

    networks:
      - expense-analyzer


  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:nightly-slim
    container_name: grafana
    restart: unless-stopped
    profiles:
      - observability

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

    ports:
      - "${GRAFANA_PORT}:3000"

    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

    networks:
      - expense-analyzer


volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  kafka_data:
  prometheus_data:
  tempo_data:
  grafana_data:


networks:
  expense-analyzer:
    driver: bridge
