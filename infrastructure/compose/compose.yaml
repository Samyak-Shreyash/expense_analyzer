services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: expense-analyzer-postgres
    restart: unless-stopped
    env_file:
      - ../../.env

    environment:
      POSTGRES_DB: $${DB_NAME}
      POSTGRES_USER: $${DB_USER}
      POSTGRES_PASSWORD: $${DB_USER_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${DB_USER} -d $${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense-analyzer


  # ============================================================
  # Expense Analyzer Backend
  # ============================================================
  backend:
    env_file:
    - ../../.env
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend/Dockerfile
    
    container_name: expense-analyzer-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/$${DB_NAME}
      SPRING_DATASOURCE_USERNAME: $${DB_USER}
      SPRING_DATASOURCE_PASSWORD: $${DB_USER_PASSWORD}

    ports:
      - "8080:8080"

    networks:
      - expense-analyzer


# ==============================================================
# Volumes
# ==============================================================
volumes:
  postgres_data:


# ==============================================================
# Network
# ==============================================================
networks:
  expense-analyzer:
    driver: bridge