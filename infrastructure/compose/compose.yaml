services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: expense-analyzer-postgres
    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      POSTGRES_DB: ${DB_NAME:-expense_analyzer}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense-analyzer


  # ============================================================
  # Expense Analyzer Backend
  # ============================================================
  backend:
    env_file:
      - ../../.env

    build:
      context: ../../backend
      dockerfile: Dockerfile

    container_name: expense-analyzer-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-expense_analyzer}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PASSWORD:?DB_USER_PASSWORD is required}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}

    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

    networks:
      - expense-analyzer


  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: expense-analyzer-prometheus
    restart: unless-stopped
    profiles:
      - observability

    env_file:
      - ../../.env

    environment:
      BACKEND_PORT: ${SERVER_PORT:-8080}

    entrypoint:
      - /bin/sh
      - -ec
    command:
      - >-
        sed "s/__BACKEND_PORT__/$${BACKEND_PORT}/g"
        /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml

    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - prometheus_data:/prometheus

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    depends_on:
      - backend
      - otel-collector

    networks:
      - expense-analyzer


  # ============================================================
  # OpenTelemetry Collector
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.142.0
    container_name: expense-analyzer-otel-collector
    restart: unless-stopped
    profiles:
      - observability

    env_file:
      - ../../.env

    command:
      - --config=/etc/otelcol-contrib/config.yml

    volumes:
      - ../observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro

    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-9464}:9464"

    depends_on:
      tempo:
        condition: service_started

    networks:
      - expense-analyzer


  # ============================================================
  # Grafana Tempo
  # ============================================================
  tempo:
    image: grafana/tempo:2.9.0
    container_name: expense-analyzer-tempo
    restart: unless-stopped
    profiles:
      - observability

    env_file:
      - ../../.env

    command:
      - -config.file=/etc/tempo/tempo.yml

    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

    ports:
      - "${TEMPO_PORT:-3200}:3200"

    networks:
      - expense-analyzer


  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:12.4.0
    container_name: expense-analyzer-grafana
    restart: unless-stopped
    profiles:
      - observability

    env_file:
      - ../../.env

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}

    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

    networks:
      - expense-analyzer


volumes:
  postgres_data:
  prometheus_data:
  tempo_data:
  grafana_data:


networks:
  expense-analyzer:
    driver: bridge
