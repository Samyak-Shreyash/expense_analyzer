services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: expense-analyzer-postgres
    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      POSTGRES_DB: ${DB_NAME:-expense_analyzer}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - expense-analyzer


  # ============================================================
  # Expense Analyzer Backend
  # ============================================================
  backend:
    env_file:
      - ../../.env

    build:
      context: ../../backend
      dockerfile: Dockerfile

    container_name: expense-analyzer-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-expense_analyzer}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_USER_PASSWORD}

    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

    networks:
      - expense-analyzer


volumes:
  postgres_data:


networks:
  expense-analyzer:
    driver: bridge
