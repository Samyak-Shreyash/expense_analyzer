global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:__BACKEND_PORT__

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:9464
