global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: default
    application: expense-analyzer

scrape_configs:
  - job_name: 'expense-analyzer-backend'
    static_configs:
      - targets: ['backend-local:8081']
        labels:
          app: expense-analyzer-backend
    metrics_path: /actuator/prometheus

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']
