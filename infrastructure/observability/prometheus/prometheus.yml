global:
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL:-15s}
  evaluation_interval: ${PROMETHEUS_EVALUATION_INTERVAL:-15s}

scrape_configs:
  - job_name: expense-analyzer-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:${SERVER_PORT:-8080}

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:${OTEL_METRICS_PORT:-9464}
